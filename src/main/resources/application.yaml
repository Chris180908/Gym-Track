spring:
  application:
    name: gymtrack
  datasource:
    url: jdbc:mysql://localhost:3306/GYMTRACK?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:220709ale}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

server:
  port: 8081
  address: "${SERVER_ADDRESS:127.0.0.1}"
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  forward-headers-strategy: framework
